<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e11f26">
<title>내 위치 3단어</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--fg:#1b1b1b;--sub:#6b6b6b;--line:#e3e3e0;--acc:#e11f26;--ok:#1a7f37;--warn:#b26a00;--kakao:#fee500}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--card:#1f1f1f;--fg:#eee;--sub:#9a9a9a;--line:#333;--ok:#4cc26a;--warn:#e0a030}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding:16px;padding-bottom:40px}
h1{font-size:20px;margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.w3w{font-size:24px;font-weight:700;word-break:keep-all;color:var(--acc)}
.w3w.en{font-size:17px;color:var(--fg);font-weight:600}
.sub{color:var(--sub);font-size:13px}
.status{font-size:14px;margin-top:8px;min-height:21px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
button,a.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:600;margin-top:10px;text-align:center;text-decoration:none;cursor:pointer}
.primary{background:var(--acc);color:#fff}
.kakao{background:var(--kakao);color:#191919}
.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)!important}
button:disabled{opacity:.45}
.row{display:flex;gap:8px}.row>*{flex:1}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:15px}
label{font-size:13px;color:var(--sub);display:block;margin:10px 0 4px}
ul{list-style:none;padding:0;margin:0}
li{padding:10px 0;border-top:1px solid var(--line);font-size:14px}
li:first-child{border-top:0}
li a{color:var(--acc);text-decoration:none;font-weight:600}
.hidden{display:none}
.gps{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;border-radius:14px;padding:14px 16px;margin:-4px 0 14px;color:#fff;font-weight:700;font-size:18px;background:#777;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.gps .dot{width:14px;height:14px;border-radius:50%;background:#fff;flex:0 0 14px}
.gps.search{background:#6b6b6b}.gps.search .dot{animation:blink 1s infinite}
.gps.good{background:#1a7f37}.gps.weak{background:#c27400}.gps.bad{background:#c62828}
.gps small{display:block;font-size:13px;font-weight:500;opacity:.9}
@keyframes blink{50%{opacity:.2}}
</style>
</head>
<body>
<div class="gps search" id="gps"><span class="dot"></span><div><span id="gpsMain">📡 GPS 찾는 중…</span><small id="gpsSub">위치 권한을 허용해 주세요</small></div></div>
<h1>📍 내 위치 → what3words → 카카오맵</h1>

<div class="card" id="setup">
  <label>what3words API 키 (이 휴대폰에만 저장)</label>
  <input id="key" type="password" placeholder="API 키 입력" autocomplete="off">
  <div class="sub" style="margin-top:8px">목표 정확도 10m 이내 · 최대 대기 20초</div>
</div>

<div class="card">
  <button class="primary" id="go">현재 위치 3단어 만들기</button>
  <div class="bar"><i id="prog"></i></div>
  <div class="status" id="status">대기 중</div>
</div>

<div class="card hidden" id="result">
  <div class="sub">한국어</div>
  <div class="w3w" id="wKo"></div>
  <div class="sub" style="margin-top:8px">English</div>
  <div class="w3w en" id="wEn"></div>
  <div class="sub" id="coord" style="margin-top:8px"></div>
  <a class="btn kakao" id="kakao" target="_blank" rel="noopener">카카오맵에서 열기 → ★ 저장</a>
  <div class="row">
    <button class="ghost" id="copy">복사</button>
    <button class="ghost" id="share">공유</button>
  </div>
  <a class="btn ghost" id="w3wmap" target="_blank" rel="noopener">what3words 지도 보기</a>
</div>

<div class="card">
  <div class="row" style="align-items:center"><b>최근 기록</b><button class="ghost" id="clear" style="margin:0;padding:6px;flex:0 0 70px;font-size:13px">지우기</button></div>
  <ul id="hist"><li class="sub">기록 없음</li></ul>
</div>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v===null?d:JSON.parse(v) }catch(e){ return d } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
};
const DEFAULT_KEY = '';
$('key').value = store.get('w3wKey', '') || DEFAULT_KEY;
$('key').addEventListener('change', e => store.set('w3wKey', e.target.value.trim()));

function setStatus(msg, pct, color){
  $('status').textContent = msg;
  $('status').style.color = color ? `var(--${color})` : '';
  if (pct !== undefined) $('prog').style.width = pct + '%';
}

// GPS 상시 감시 (페이지 열자마자 시작) → 상단 배너로 상태 표시
const TARGET_M = 10, MAX_SEC = 20;
let lastFix = null, gpsErr = null, collector = null;
function gpsBanner(cls, main, sub){ $('gps').className = 'gps ' + cls; $('gpsMain').textContent = main; $('gpsSub').textContent = sub; }
function startGps(){
  if (!navigator.geolocation) { gpsBanner('bad','❌ 위치 기능 없음','이 브라우저는 GPS를 지원하지 않습니다'); return; }
  if (!isSecureContext) gpsBanner('bad','❌ HTTPS 필요','https 주소(GitHub Pages 등)에서 열어야 GPS가 됩니다');
  navigator.geolocation.watchPosition(p => {
    gpsErr = null;
    lastFix = {lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy, t:Date.now()};
    if (collector) collector(lastFix);
    updateBanner();
  }, err => {
    gpsErr = {1:'위치 권한 거부됨 – 브라우저 설정에서 허용',2:'위치를 찾을 수 없음 – GPS/위치 켜기 확인',3:'GPS 응답 지연 – 하늘이 보이는 곳으로'}[err.code] || err.message;
    updateBanner();
  }, {enableHighAccuracy:true, maximumAge:0, timeout:30000});
}
function updateBanner(){
  if (gpsErr && (!lastFix || Date.now()-lastFix.t > 5000)) { gpsBanner('bad','❌ GPS 실패', gpsErr); return; }
  if (!lastFix) { gpsBanner('search','📡 GPS 찾는 중…','위치 권한을 허용해 주세요'); return; }
  const age = (Date.now()-lastFix.t)/1000, a = lastFix.acc.toFixed(0);
  if (age > 5) gpsBanner('weak', `⚠ GPS 신호 끊김 (${age.toFixed(0)}초 전 ±${a}m)`, '실내·지하면 창가나 실외로 이동');
  else if (lastFix.acc <= TARGET_M) gpsBanner('good', `✅ GPS 잡힘 ±${a}m`, '정확도 양호 – 바로 만들 수 있습니다');
  else gpsBanner('weak', `⚠ GPS 약함 ±${a}m`, `10m 이내로 좋아질 때까지 잠시 대기`);
}
setInterval(updateBanner, 1000);
startGps();

// 버튼을 누른 뒤 들어오는 위치를 모아 평균 (10m 이내 3개 또는 20초)
function getFix(){
  return new Promise((resolve, reject) => {
    const samples = []; const t0 = Date.now();
    const finish = () => {
      collector = null; clearInterval(tick);
      if (!samples.length) {
        if (lastFix && Date.now()-lastFix.t < 30000) samples.push(lastFix);
        else return reject(new Error(gpsErr || '20초 동안 위치를 받지 못했습니다'));
      }
      const best = samples.slice().sort((a,b)=>a.acc-b.acc).slice(0,5);
      let sw=0, la=0, lo=0;
      best.forEach(s=>{ const w=1/(s.acc*s.acc); sw+=w; la+=s.lat*w; lo+=s.lng*w; });
      resolve({lat:la/sw, lng:lo/sw, acc:best[0].acc, n:samples.length});
    };
    collector = s => {
      samples.push(s);
      const bestAcc = Math.min(...samples.map(x=>x.acc));
      setStatus(`[1/3] 위치 모으는 중… 샘플 ${samples.length}개 · 최고 ±${bestAcc.toFixed(0)}m`,
                Math.min(60, 10 + (Date.now()-t0)/(MAX_SEC*1000)*50));
      if (samples.filter(x=>x.acc<=TARGET_M).length >= 3) finish();
    };
    const tick = setInterval(()=>{
      const sec = (Date.now()-t0)/1000;
      if (!samples.length) setStatus(`[1/3] 위치 기다리는 중… ${sec.toFixed(0)}/${MAX_SEC}초`, Math.min(60, 10+sec/MAX_SEC*50));
      if (sec > MAX_SEC) finish();
    }, 500);
  });
}

// 2단계: what3words 변환
async function toW3W(lat, lng, lang, key){
  const u = `https://api.what3words.com/v3/convert-to-3wa?coordinates=${lat.toFixed(6)},${lng.toFixed(6)}&language=${lang}&key=${encodeURIComponent(key)}`;
  const r = await fetch(u); const j = await r.json();
  if (j.error) throw new Error(`what3words: ${j.error.message || j.error.code}`);
  return j.words;
}

let last = null;
$('go').onclick = async () => {
  const key = $('key').value.trim();
  if (!key) { setStatus('what3words API 키를 먼저 입력하세요', 0, 'warn'); return; }
  store.set('w3wKey', key);
  $('go').disabled = true; $('result').classList.add('hidden');
  try {
    setStatus('[1/3] 위치 모으기 시작', 5);
    const fix = await getFix();
    const accColor = fix.acc <= 10 ? 'ok' : 'warn';
    setStatus(`[2/3] what3words 변환 중… (±${fix.acc.toFixed(0)}m, 샘플 ${fix.n}개)`, 70);
    const [ko, en] = await Promise.all([toW3W(fix.lat, fix.lng, 'ko', key), toW3W(fix.lat, fix.lng, 'en', key)]);
    setStatus('[3/3] 카카오맵 링크 생성 중…', 90);
    last = {ko, en, lat:fix.lat, lng:fix.lng, acc:fix.acc, t:Date.now()};
    render(last);
    const h = store.get('hist', []); h.unshift(last); store.set('hist', h.slice(0,20)); renderHist();
    setStatus(`완료 ✔ 정확도 ±${fix.acc.toFixed(0)}m${fix.acc>10?' (3m 칸 기준 오차 가능)':''}`, 100, accColor);
  } catch(e) {
    setStatus('실패: ' + e.message, 0, 'warn');
  } finally { $('go').disabled = false; }
};

function kakaoUrl(x){ return `https://map.kakao.com/link/map/${encodeURIComponent('///'+x.ko)},${x.lat.toFixed(6)},${x.lng.toFixed(6)}`; }
function render(x){
  $('wKo').textContent = '///' + x.ko;
  $('wEn').textContent = '///' + x.en;
  $('coord').textContent = `${x.lat.toFixed(6)}, ${x.lng.toFixed(6)} · ±${x.acc.toFixed(0)}m`;
  $('kakao').href = kakaoUrl(x);
  $('w3wmap').href = `https://what3words.com/${encodeURIComponent(x.en)}`;
  $('result').classList.remove('hidden');
}
function shareText(x){ return `///${x.ko}\n///${x.en}\n${kakaoUrl(x)}`; }
$('copy').onclick = async () => {
  if (!last) return;
  try { await navigator.clipboard.writeText(shareText(last)); setStatus('복사됨 ✔', 100, 'ok'); }
  catch(e){ setStatus('복사 실패 – 길게 눌러 직접 복사하세요', 100, 'warn'); }
};
$('share').onclick = async () => {
  if (!last) return;
  if (navigator.share) { try { await navigator.share({title:'내 위치', text:shareText(last)}); } catch(e){} }
  else $('copy').onclick();
};
function renderHist(){
  const h = store.get('hist', []); const ul = $('hist'); ul.innerHTML = '';
  if (!h.length) { ul.innerHTML = '<li class="sub">기록 없음</li>'; return; }
  h.forEach(x => {
    const li = document.createElement('li');
    const a = document.createElement('a'); a.href = kakaoUrl(x); a.target = '_blank'; a.textContent = '///' + x.ko;
    const s = document.createElement('div'); s.className = 'sub';
    s.textContent = `${new Date(x.t).toLocaleString('ko-KR')} · ±${x.acc.toFixed(0)}m · ///${x.en}`;
    li.append(a, s); ul.append(li);
  });
}
$('clear').onclick = () => { store.set('hist', []); renderHist(); };
renderHist();
</script>
</body>
</html>
